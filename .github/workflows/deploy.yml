name: Auto Deploy to VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        env:
          NINEROUTER_API_KEY: ${{ secrets.NINEROUTER_API_KEY }}
        run: |
          # 1. Simpan key ke file privat VPS jika diisi di GitHub Secrets
          if [ -n "$NINEROUTER_API_KEY" ]; then
            echo "NINEROUTER_API_KEY=$NINEROUTER_API_KEY" > /home/rusly/.monitoringmedia.env
          elif [ ! -f /home/rusly/.monitoringmedia.env ]; then
            # Ambil dari container sendiri jika file belum ada
            docker inspect pulsescope-nlp --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -E '^NINEROUTER_API_KEY=' > /home/rusly/.monitoringmedia.env || true
          fi

          # 2. Salin env privat ke project
          cp /home/rusly/.monitoringmedia.env .env 2>/dev/null || true

          echo "🐳 [1/3] Membangun ulang dan memperbarui container Docker..."
          docker compose up --build -d

          echo "🔌 Menghubungkan jaringan ke bappisus-9router-1..."
          docker network connect $(docker inspect pulsescope-nlp --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' 2>/dev/null) bappisus-9router-1 2>/dev/null || true

          echo "⏳ Menunggu database siap..."
          sleep 5

          echo "📦 [2/3] Menjalankan migrasi database..."
          docker compose exec -T backend php artisan migrate --force

          echo "🧹 [3/3] Membersihkan dan merefresh cache aplikasi..."
          docker compose exec -T backend php artisan optimize:clear
          docker compose exec -T backend php artisan config:cache
          docker compose exec -T backend php artisan route:cache

          echo "✅ Deployment selesai! Aplikasi berhasil diperbarui di https://media.antiquetech.web.id"
