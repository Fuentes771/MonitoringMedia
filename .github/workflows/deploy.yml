name: Auto Deploy to VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          echo "🔑 Mengecek API key 9Router dari bappisus..."
          BAPPISUS_KEY=$(docker exec bappisus-app-1 printenv NINE_ROUTER_API_KEY 2>/dev/null || docker exec bappisus-app-1 printenv OPENAI_API_KEY 2>/dev/null || docker exec bappisus-app-1 grep -m 1 -E '^(NINE_ROUTER_API_KEY|OPENAI_API_KEY)=' /var/www/html/.env 2>/dev/null | cut -d= -f2 | tr -d '"' | tr -d "'" || true)
          if [ -n "$BAPPISUS_KEY" ]; then
            echo "NINE_ROUTER_API_KEY=$BAPPISUS_KEY" > .env
            echo "Key 9Router berhasil diambil dari environment bappisus."
          fi

          echo "🐳 [1/3] Membangun ulang dan memperbarui container Docker..."
          docker compose up --build -d

          echo "🔌 Menghubungkan jaringan ke bappisus-9router-1..."
          docker network connect $(docker inspect pulsescope-nlp --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' 2>/dev/null) bappisus-9router-1 2>/dev/null || true

          echo "⏳ Menunggu database siap..."
          sleep 5

          echo "📦 [2/3] Menjalankan migrasi database..."
          docker compose exec -T backend php artisan migrate --force

          echo "🧹 [3/3] Membersihkan dan merefresh cache aplikasi..."
          docker compose exec -T backend php artisan optimize:clear
          docker compose exec -T backend php artisan config:cache
          docker compose exec -T backend php artisan route:cache

          echo "✅ Deployment selesai! Aplikasi berhasil diperbarui di https://media.antiquetech.web.id"
