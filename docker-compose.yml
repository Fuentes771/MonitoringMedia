services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsescope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsescope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsescope-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nlp:
    build:
      context: ./nlp-service
      dockerfile: ../docker/nlp.Dockerfile
    container_name: pulsescope-nlp
    restart: unless-stopped
    environment:
      - NINE_ROUTER_BASE_URL=http://bappisus-9router-1:20128/v1
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: pulsescope-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_healthy
    environment:
      APP_NAME: PulseScope
      APP_ENV: production
      APP_KEY: base64:Jn3TOaXgpeEBXPw6EscFr53t7V0gU6gnMXMG1+64zv4=
      APP_DEBUG: "false"
      APP_URL: https://media.antiquetech.web.id
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pulsescope
      DB_USERNAME: postgres
      DB_PASSWORD: secretpassword
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      NLP_SERVICE_URL: http://nlp:8001
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: pulsescope-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80"

volumes:
  pgdata:
  redisdata:

