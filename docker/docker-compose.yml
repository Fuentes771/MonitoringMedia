version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsescope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsescope}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsescope-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  nlp:
    build:
      context: ../nlp-service
      dockerfile: ../docker/nlp.Dockerfile
    container_name: pulsescope-nlp
    restart: unless-stopped
    environment:
      - NINE_ROUTER_BASE_URL=${NINE_ROUTER_BASE_URL:-http://bappisus-9router-1:20128/v1}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY:-}
      - NINEROUTER_MODEL=${NINEROUTER_MODEL:-ag/gemini-3.8-flash-medium}
      - NLP_ENABLE_DOCS=${NLP_ENABLE_DOCS:-false}
      - NLP_CORS_ORIGINS=${NLP_CORS_ORIGINS:-http://backend:8000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: pulsescope-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_healthy
    environment:
      APP_NAME: TRINETRA
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY must be set in .env}
      APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://127.0.0.1:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-pulsescope}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_CLIENT: predis
      NLP_SERVICE_URL: http://nlp:8001
      TRINETRA_API_KEY: ${TRINETRA_API_KEY:-}
      TRINETRA_MUSE_WORKSPACE_ID: ${TRINETRA_MUSE_WORKSPACE_ID:-}
      TRINETRA_INGEST_RATE_LIMIT: ${TRINETRA_INGEST_RATE_LIMIT:-10}

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: pulsescope-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
  redisdata:

