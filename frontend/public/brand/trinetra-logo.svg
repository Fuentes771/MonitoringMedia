<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Metallic Luxury Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <!-- Radiant Platinum Gradient -->
    <linearGradient id="platinumGleam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="50%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Gold Core Glow Filter -->
    <filter id="goldAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Almond Contour (The Eye of Trinetra) -->
  <path
    d="M 8 50 Q 50 16 92 50 Q 50 84 8 50 Z"
    stroke="url(#goldMetallic)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Subtle Inner Platinum Contour -->
  <path
    d="M 18 50 Q 50 25 82 50 Q 50 75 18 50 Z"
    stroke="url(#platinumGleam)"
    stroke-width="1.2"
    stroke-dasharray="2 3"
    opacity="0.45"
    fill="none"
  />

  <!-- Concentric Celestial Iris Rings -->
  <circle cx="50" cy="50" r="22" stroke="url(#goldMetallic)" stroke-width="1.6" opacity="0.85" />
  <circle cx="50" cy="50" r="16" stroke="url(#platinumGleam)" stroke-width="1" stroke-dasharray="1.5 2.5" opacity="0.6" />

  <!-- The Third Eye Vertical Sacred Aperture (Pupil) -->
  <path
    d="M 50 30 Q 59 50 50 70 Q 41 50 50 30 Z"
    fill="url(#goldMetallic)"
    filter="url(#goldAura)"
  />

  <!-- Central Diamond Core (The Spark of Discernment) -->
  <circle cx="50" cy="50" r="3.2" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="1.5" fill="#BF953F" />

  <!-- Triad Vision Markers (Past, Present, Horizon) -->
  <circle cx="50" cy="17" r="2" fill="url(#goldMetallic)" />
  <circle cx="28" cy="50" r="1.5" fill="url(#platinumGleam)" />
  <circle cx="72" cy="50" r="1.5" fill="url(#platinumGleam)" />
  <circle cx="50" cy="83" r="2" fill="url(#goldMetallic)" />
</svg>
