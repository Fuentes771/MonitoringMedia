<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Metallic Luxury Gold Gradient -->
    <linearGradient id="goldFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="30%" stop-color="#FCF6BA" />
      <stop offset="60%" stop-color="#B38728" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <!-- Platinum Gradient -->
    <linearGradient id="platFavicon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Eye Almond Shape -->
  <path
    d="M 6 50 Q 50 14 94 50 Q 50 86 6 50 Z"
    stroke="url(#goldFavicon)"
    stroke-width="4.5"
    fill="none"
  />

  <!-- Concentric Rings -->
  <circle cx="50" cy="50" r="23" stroke="url(#goldFavicon)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="15" stroke="url(#platFavicon)" stroke-width="1.8" opacity="0.8" />

  <!-- Sacred Vertical Aperture -->
  <path
    d="M 50 28 Q 60 50 50 72 Q 40 50 50 28 Z"
    fill="url(#goldFavicon)"
    filter="url(#goldGlow)"
  />

  <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="2" fill="#B38728" />
</svg>
