<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="psPulse" x1="2" y1="16" x2="30" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Radar Crosshair Ring (Transparent background, no box) -->
  <circle cx="16" cy="16" r="13" stroke="url(#psPulse)" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.6" />
  <circle cx="16" cy="16" r="8.5" stroke="#38bdf8" stroke-width="1" opacity="0.35" />

  <!-- Central Dynamic Pulse Waveform -->
  <path
    d="M3 16h4.5l3-7 4.5 15 4-11 3 6h7"
    stroke="url(#psPulse)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Active Telemetry Nodes -->
  <circle cx="15" cy="24" r="1.5" fill="#00f2fe" />
  <circle cx="10.5" cy="9" r="1.5" fill="#38bdf8" />
</svg>
